[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord/supervisord.log
childlogdir=/var/log/supervisord/
logfile_maxbytes=50MB
logfile_backups=10
loglevel=error

# ------------------------------------------------------------------ #
# Official Nextcloud entrypoint: install/update + hooks, then apache.
# ------------------------------------------------------------------ #
[program:nextcloud]
command=/entrypoint.sh apache2-foreground
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# ------------------------------------------------------------------ #
# Background tasks
# ------------------------------------------------------------------ #
[program:cron]
command=/cron.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# ------------------------------------------------------------------ #
# High Performance Backend (notify_push). Port and table prefix are
# injected from the container environment (no hardcoded value).
# ------------------------------------------------------------------ #
[program:notify_push]
command=/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push --port %(ENV_NOTIFY_PUSH_PORT)s --database-prefix %(ENV_NOTIFY_PUSH_DB_PREFIX)s /var/www/html/config/config.php
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=30
