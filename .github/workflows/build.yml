name: build-and-push

# Rebuilds the image and pushes it to GHCR:
#   - once a month (picks up base nextcloud:production-apache updates)
#   - on every push to main
#   - manually (workflow_dispatch)
# Watchtower, on the server, detects the new digest and updates on its own.

on:
  schedule:
    - cron: '0 4 1 * *'        # 1st of every month, 04:00 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Fully derived from the current repo: ghcr.io/<owner>/<repo>.
  # No hardcoded name -> package == repo -> automatic link + Actions rights.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true                     # force a refresh of the base image
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
